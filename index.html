<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- google fonts roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <title>SkySight</title>
    <link rel="stylesheet" href="./dist/output.css">
    <style>
        *{
            /* border: 1px solid red; */
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>SkySight</h1>
        </div>
    </header>

    <main>
        <!-- search section -->
        <section class="search-section glass">
            <!-- search section -->
            <input type="text" placeholder="Search city" id="cityInput">
            <button id="searchBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </section>

        <!-- weather section -->
        <section class="weather-section">
            <!-- location & current weather -->
            <div class="location-current-weather glass">
                <!-- location -->
                <div class="location">
                    <h2 id="cityName"></h2>
                    <p id="countryName"></p>
                </div>

                <!-- current weather -->
                <div class="current-weather">
                    <div class="icon-temperature">
                        <!-- icon -->
                        <img id="weatherIcon" src="" alt="Weather icon">

                        <!-- temperature -->
                        <p id="temperature"></p>
                    </div>
                    
                    <!-- condition -->
                    <p id="condition"></p>
                </div>
            </div>
        </section>

        <!-- weather details -->
        <section class="weather-details">
            <!-- feels like -->
            <div class="card glass">
                <i class="fa-solid fa-temperature-half text-orange-500"></i>
                <p>Feels Like</p>
                <p id="feelsLike"></p>
            </div>

            <!-- humidity -->
            <div class="card glass">
                <i class="fa-solid fa-droplet text-blue-500"></i>
                <p>Humidity</p>
                <p id="humidity"></p>
            </div>

            <!-- wind speed -->
            <div class="card glass">
                <i class="fa-solid fa-wind text-cyan-400"></i>
                <p>Wind Speed</p>
                <p id="windSpeed"></p>
            </div>

            <!-- pressure -->
            <div class="card glass">
                <i class="fa-solid fa-gauge-high text-purple-400"></i>
                <p>Pressure</p>
                <p id="pressure">1012 hPa</p>
            </div>

            <!-- visibility -->
            <div class="card glass">
                <i class="fa-solid fa-eye text-slate-300"></i>
                <p>Visibility</p>
                <p id="visibility"></p>
            </div>

            <!-- cloudiness -->
            <div class="card glass">
                <i class="fa-solid fa-cloud text-gray-300"></i>
                <p>Cloudiness</p>
                <p id="cloudiness">40%</p>
            </div>

            <!-- sunrise -->
            <div class="card glass">
                <i class="fa-solid fa-sun text-yellow-400"></i>
                <p>Sunrise</p>
                <p id="sunrise">--:--</p>
            </div>

            <!-- sunset -->
            <div class="card glass">
                <i class="fa-solid fa-cloud-sun text-yellow-400"></i>
                <p>Sunset</p>
                <p id="sunset">--:--</p>
            </div>
        </section>
    </main>

    <script src="./config.js" defer></script>
    <script src="./src/script.js" defer></script>
</body>
</html>
